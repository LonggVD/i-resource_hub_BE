# H2 in-memory DB cho test - dùng MySQL compatibility mode để các native query (GREATEST/LEAST/CASE) hoạt động giống MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA: tự tạo schema theo entity, drop khi tắt
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# JWT test config
jwt.secret=TestSecretKeyForUnitTestingOnly123456789012345678901234567890
jwt.expiration=3600000

# Tắt các tác vụ ngoài tầm test
spring.mail.host=localhost
spring.mail.port=25

# Tắt scheduling trong test (BookingCleanupTask sẽ không tự chạy)
spring.task.scheduling.pool.size=0

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.i_resource_hub=INFO

# PayOS dummy
client_id=test
api_key=test
base_url=http://localhost
return_url=http://localhost
cancel_url=http://localhost
checksum_key=test

# CORS
app.cors.allowed-origins=http://localhost
